on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 16
          registry-url: https://registry.npmjs.org
      - run: yarn install
      # Publishing needs npm OIDC / registry credentials the fork does not have.
      # Pack the identical tarball instead: `dist/` is what prepublishOnly builds.
      - run: node node_modules/rollup/dist/bin/rollup -c
      - run: npm pack --ignore-scripts
      # Tag v2.8.2 still declares 2.8.1 in package.json; post_build stamps the
      # sealed version, so only name the tarball after the release it reproduces.
      - run: mv svgo-2.8.1.tgz svgo-2.8.2.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: svgo-*.tgz
          if-no-files-found: error
